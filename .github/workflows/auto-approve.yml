name: Auto approve
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
            github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check workflow actor
        run: echo "Workflow actor is ${{ github.actor }}"
